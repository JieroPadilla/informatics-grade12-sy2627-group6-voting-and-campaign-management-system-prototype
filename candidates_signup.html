<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Sign Up</title>
    <style>
      * {
        font-family: arial;
      }
    </style>
  </head>
  <body>
    <header></header>
    <main>
      <h1>Sign Up</h1>
      <form action="main.html">
        <label for="uname">Username</label><br>
        <input type="text" id="uname" name="uname"><br>
        <label for="password">Password</label><br>
        <input type="password" id="password" name="password"><br>
        <label for="password_confirm">Confirm Password</label><br>
        <input type="password_confirm" id="password_confirm" name="password_confirm"><br><br>
        <input type="submit" value="Submit"><br><br>
        <a href="main.html">Already have an account? Log in.</a>
      </form>
    </main>
    <footer></footer>
  </body>
</html>
