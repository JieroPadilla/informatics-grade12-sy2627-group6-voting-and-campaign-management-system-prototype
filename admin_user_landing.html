<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Welcome</title>
    <style>
      :root {
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --bg-color: #f8fafc;
        --card-bg: #ffffff;
        --text-main: #1e293b;
        --text-muted: #64748b;
        --border-color: #cbd5e1;
        --radius: 8px;
      }
      * {
        box-sizing: border-box;
        font-family: 'Segoe UI', Arial, sans-serif;
      }
      body {
        background-color: var(--bg-color);
        color: var(--text-main);
        margin: 0;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
      }
      header, main, footer {
        background: var(--card-bg);
        width: 100%;
        max-width: 600px;
        padding: 2rem;
        margin-bottom: 1.5rem;
        border-radius: var(--radius);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
      }
      header h1 {
        margin: 0;
        color: var(--primary);
        font-size: 1.75rem;
      }
      h2 {
        color: var(--text-main);
        font-size: 1.2rem;
        border-bottom: 2px solid #f1f5f9;
        padding-bottom: 0.5rem;
        margin-top: 1.5rem;
      }
      button, input[type="submit"] {
        display: block;
        width: 100%;
        background-color: var(--primary);
        color: white;
        border: none;
        padding: 0.85rem 1.5rem;
        font-size: 1rem;
        font-weight: 600;
        border-radius: var(--radius);
        cursor: pointer;
        transition: background-color 0.2s ease;
        margin-top: 0.75rem;
        text-align: center;
      }
      button:hover, input[type="submit"]:hover {
        background-color: var(--primary-hover);
      }
      #addPartylist {
        position: fixed;
        background: #ffffff;
        border: 1px solid var(--border-color);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 2rem;
        width: 100%;
        max-width: 400px;
        border-radius: var(--radius);
        z-index: 100;
      }
      #addPartylist textarea {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid var(--border-color);
        border-radius: var(--radius);
        margin-bottom: 1rem;
      }
      .close-modal {
        position: absolute;
        top: 10px;
        right: 10px;
        background: #ef4444 !important;
        width: 30px !important;
        height: 30px !important;
        padding: 0 !important;
        display: flex !important;
        align-items: center;
        justify-content: center;
        border-radius: 50% !important;
      }
      footer {
        text-align: center;
        padding: 1rem;
        margin-bottom: 0;
      }
      footer a {
        color: var(--text-muted);
        text-decoration: none;
        font-weight: 600;
      }
      footer a:hover {
        color: var(--primary);
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Welcome, Admin!</h1>
    </header>
    <main>
      <h2>Edit Campaigns</h2>
      <button type="button" onclick="window.location.href='admin_campaign_page.html';">Edit Party List 1</button>
      <button type="button" onclick="window.location.href='admin_campaign_page.html';">Edit Party List 2</button>
      <button type="button" onclick="window.location.href='admin_campaign_page.html';">Edit Party List 3</button>
      <button type="button" onclick="addPartylist()">Add Party List</button>
      <h2>Edit Candidates</h2>
      <button type="button" onclick="window.location.href='admin_voting_page.html';">Manage Candidates</button>

      <div id="addPartylist" style="display:none;">
        <button type="button" class="close-modal" onclick="addPartylist()">x</button>
        <form>
          <label for="name">Party List Name</label><br>
          <textarea id="name" name="name">Party List 4</textarea>
          <input type="submit" value="Save">
        </form>
      </div>
      <script>
        function addPartylist() {
          var x = document.getElementById("addPartylist");
          if (x.style.display === "none") {
            x.style.display = "block";
          } else {
            x.style.display = "none";
          }
        }
      </script>
    </main>
    <footer>
      <a href="admin_main.html">Logout.</a>
    </footer>
  </body>
</html>
