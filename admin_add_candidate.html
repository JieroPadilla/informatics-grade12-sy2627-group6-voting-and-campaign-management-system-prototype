<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Welcome</title>
    <style>
      :root {
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --bg-color: #f8fafc;
        --card-bg: #ffffff;
        --text-main: #1e293b;
        --text-muted: #64748b;
        --border-color: #cbd5e1;
        --radius: 8px;
      }
      * {
        box-sizing: border-box;
        font-family: 'Segoe UI', Arial, sans-serif;
      }
      body {
        background-color: var(--bg-color);
        color: var(--text-main);
        margin: 0;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      header, main, footer {
        background: var(--card-bg);
        width: 100%;
        max-width: 500px;
        padding: 2rem;
        margin-bottom: 1.5rem;
        border-radius: var(--radius);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
      }
      header h1 {
        margin: 0;
        color: var(--primary);
        font-size: 1.5rem;
      }
      form {
        display: flex;
        flex-direction: column;
      }
      label {
        font-weight: 600;
        margin-bottom: 0.35rem;
        font-size: 0.9rem;
      }
      textarea, select {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid var(--border-color);
        border-radius: var(--radius);
        font-size: 1rem;
        margin-bottom: 1rem;
        background-color: #fff;
      }
      textarea {
        resize: vertical;
        height: 80px;
      }
      input[type="submit"], button {
        background-color: var(--primary);
        color: white;
        border: none;
        padding: 0.75rem 1.5rem;
        font-size: 1rem;
        font-weight: 600;
        border-radius: var(--radius);
        cursor: pointer;
        transition: background-color 0.2s ease;
        width: 100%;
      }
      input[type="submit"]:hover, button:hover {
        background-color: var(--primary-hover);
      }
      button {
        background-color: #64748b;
        margin-top: 0.5rem;
      }
      button:hover {
        background-color: #475569;
      }
      footer {
        text-align: center;
        padding: 1rem;
        margin-bottom: 0;
      }
      footer a {
        color: var(--text-muted);
        text-decoration: none;
        font-weight: 600;
      }
      footer a:hover {
        color: var(--primary);
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Input Candidate Credentials</h1>
    </header>
    <main>
      <form>
        <label for="name">Candidate Name</label>
        <textarea id="name" name="name">Candidate 4</textarea>

        <label for="partylists">Choose Party List</label>
        <select name="partylists" id="partylists">
          <option value="partylist_1">Party List 1</option>
          <option value="partylist_2">Party List 2</option>
          <option value="partylist_3">Party List 3</option>
        </select>

        <input type="submit" value="Save">
      </form>
      <button type="button" onclick="window.location.href='admin_voting_page.html';">Return</button>
    </main>
    <footer>
      <a href="admin_main.html">Logout.</a>
    </footer>
  </body>
</html>
