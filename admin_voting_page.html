<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Vote</title>
    <style>
      :root {
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --bg-color: #f8fafc;
        --card-bg: #ffffff;
        --text-main: #1e293b;
        --text-muted: #64748b;
        --border-color: #cbd5e1;
        --radius: 8px;
      }
      * {
        box-sizing: border-box;
        font-family: 'Segoe UI', Arial, sans-serif;
      }
      body {
        background-color: var(--bg-color);
        color: var(--text-main);
        margin: 0;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
      }
      header, main, footer {
        background: var(--card-bg);
        width: 100%;
        max-width: 700px;
        padding: 2rem;
        margin-bottom: 1.5rem;
        border-radius: var(--radius);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
      }
      header h1 {
        margin: 0;
        color: var(--primary);
        font-size: 1.75rem;
      }
      h2 {
        color: var(--primary);
        font-size: 1.15rem;
        border-bottom: 2px solid #f1f5f9;
        padding-bottom: 0.3rem;
        margin-top: 1.5rem;
      }
      textarea {
        width: 100%;
        padding: 0.6rem;
        border: 1px solid var(--border-color);
        border-radius: var(--radius);
        font-size: 0.95rem;
        margin-bottom: 0.5rem;
        resize: vertical;
        height: 45px;
      }
      .add-candidate-btn {
        background-color: #0d9488;
        color: white;
        border: none;
        padding: 0.5rem 1rem;
        font-size: 0.9rem;
        font-weight: 600;
        border-radius: var(--radius);
        cursor: pointer;
        margin-bottom: 1rem;
      }
      .add-candidate-btn:hover {
        background-color: #0f766e;
      }
      input[type="submit"], .return-btn {
        background-color: var(--primary);
        color: white;
        border: none;
        padding: 0.75rem 1.5rem;
        font-size: 1rem;
        font-weight: 600;
        border-radius: var(--radius);
        cursor: pointer;
        width: 100%;
        margin-top: 1rem;
      }
      input[type="submit"]:hover, .return-btn:hover {
        background-color: var(--primary-hover);
      }
      .return-btn {
        background-color: #64748b;
      }
      .return-btn:hover {
        background-color: #475569;
      }
      #addCandidate {
        position: fixed;
        background: #ffffff;
        border: 1px solid var(--border-color);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 2rem;
        width: 100%;
        max-width: 400px;
        border-radius: var(--radius);
        z-index: 100;
      }
      #addCandidate textarea {
        height: 80px;
      }
      .close-modal {
        position: absolute;
        top: 10px;
        right: 10px;
        background: #ef4444 !important;
        color: white !important;
        width: 30px !important;
        height: 30px !important;
        padding: 0 !important;
        display: flex !important;
        align-items: center;
        justify-content: center;
        border-radius: 50% !important;
        border: none;
        cursor: pointer;
      }
      footer {
        text-align: center;
        padding: 1rem;
        margin-bottom: 0;
      }
      footer a {
        color: var(--text-muted);
        text-decoration: none;
        font-weight: 600;
      }
      footer a:hover {
        color: var(--primary);
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Edit Candidates</h1>
    </header>
    <main>
      <form>
        <h2>President</h2>
        <textarea>Candidate 1 (Party List 1)</textarea>
        <textarea>Candidate 2 (Party List 2)</textarea>
        <textarea>Candidate 3 (Party List 3)</textarea>
        <button type="button" class="add-candidate-btn" onclick="addCandidate()">Add Candidate</button>

        <h2>Vice President</h2>
        <textarea>Candidate 1 (Party List 1)</textarea>
        <textarea>Candidate 2 (Party List 2)</textarea>
        <textarea>Candidate 3 (Party List 3)</textarea>
        <button type="button" class="add-candidate-btn" onclick="addCandidate()">Add Candidate</button>

        <h2>Secretary</h2>
        <textarea>Candidate 1 (Party List 1)</textarea>
        <textarea>Candidate 2 (Party List 2)</textarea>
        <textarea>Candidate 3 (Party List 3)</textarea>
        <button type="button" class="add-candidate-btn" onclick="addCandidate()">Add Candidate</button>

        <h2>Auditor</h2>
        <textarea>Candidate 1 (Party List 1)</textarea>
        <textarea>Candidate 2 (Party List 2)</textarea>
        <textarea>Candidate 3 (Party List 3)</textarea>
        <button type="button" class="add-candidate-btn" onclick="addCandidate()">Add Candidate</button>

        <h2>Public Information Officer</h2>
        <textarea>Candidate 1 (Party List 1)</textarea>
        <textarea>Candidate 2 (Party List 2)</textarea>
        <textarea>Candidate 3 (Party List 3)</textarea>
        <button type="button" class="add-candidate-btn" onclick="addCandidate()">Add Candidate</button>

        <h2>Peace Officer</h2>
        <textarea>Candidate 1 (Party List 1)</textarea>
        <textarea>Candidate 2 (Party List 2)</textarea>
        <textarea>Candidate 3 (Party List 3)</textarea>
        <button type="button" class="add-candidate-btn" onclick="addCandidate()">Add Candidate</button>

        <h2>Grade Level Councilors</h2>
        <textarea>Candidate 1 (Party List 1)</textarea>
        <textarea>Candidate 2 (Party List 2)</textarea>
        <textarea>Candidate 3 (Party List 3)</textarea>
        <button type="button" class="add-candidate-btn" onclick="addCandidate()">Add Candidate</button>

        <h2>Grade Level Chairperson</h2>
        <textarea>Candidate 1 (Party List 1)</textarea>
        <textarea>Candidate 2 (Party List 2)</textarea>
        <textarea>Candidate 3 (Party List 3)</textarea>
        <button type="button" class="add-candidate-btn" onclick="addCandidate()">Add Candidate</button>

        <h2>Grade Level Representatives</h2>
        <textarea>Candidate 1 (Party List 1)</textarea>
        <textarea>Candidate 2 (Party List 2)</textarea>
        <textarea>Candidate 3 (Party List 3)</textarea>
        <button type="button" class="add-candidate-btn" onclick="addCandidate()">Add Candidate</button>

        <input type="submit" value="Save">
        <button type="button" class="return-btn" onClick="window.location.href='admin_user_landing.html';">Return</button>

        <div id="addCandidate" style="display:none;">
          <button type="button" class="close-modal" onclick="addCandidate()">x</button>
          <form>
            <label for="name">Candidate Name</label><br>
            <textarea id="name" name="name">Candidate 4</textarea><br><br>
            <label for="partylists">Choose Party List</label><br>
            <select name="partylists" id="partylists" style="width:100%; padding:0.75rem; border-radius:8px; border:1px solid #cbd5e1; margin-bottom:1rem;">
              <option value="partylist_1">Party List 1</option>
              <option value="partylist_2">Party List 2</option>
              <option value="partylist_3">Party List 3</option>
            </select><br><br>
            <input type="submit" value="Save">
          </form>
        </div>
        <script>
          function addCandidate() {
            var x = document.getElementById("addCandidate");
              if (x.style.display === "none") {
                x.style.display = "block";
              } else {
                x.style.display = "none";
              }
          }
        </script>
      </form>
    </main>
    <footer>
      <a href="admin_main.html">Logout.</a>
    </footer>
  </body>
</html>
