        <div id="addCandidate" style="display:none;">
          <button type="button" onclick="addCandidate()" style="position: absolute; top: 5px; right: 5px">x</button>
          <form>
            <label for="name">Candidate Name</label><br>
            <textarea id="name" name="name">Candidate 4</textarea><br><br>
            <label for="partylists">Choose Party List</label><br>
            <select name="partylists" id="partylists">

            <input type="submit" value="Save">
          </form>
        </div>
        <script>
          function addCandidate() {
            var x = document.getElementById("addCandidate");
              if (x.style.display === "none") {
                x.style.display = "block";
              } else {
                x.style.display = "none";
              }
          }
